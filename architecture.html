<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>架构设计 - 四级导航版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
html,body{width:100%;height:100dvh;overflow:hidden;background:#f6f7f9;color:#333;}
body{display:flex;flex-direction:column;}

/* ===== 固定顶部区域 ===== */
.top-shell{flex-shrink:0;background:#fff;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.04);}

.page-header{height:42px;display:flex;align-items:center;padding:0 16px;gap:10px;}
.back-btn{font-size:20px;color:#1a1a1a;cursor:pointer;width:24px;}
.page-title{font-size:16px;font-weight:600;flex:1;}
.more-btn{color:#6366f1;font-size:16px;cursor:pointer;}

.select-wrap{display:flex;align-items:center;padding:6px 16px 8px;gap:8px;}
.select-wrap .select-label{font-size:13px;color:#666;white-space:nowrap;}
.select-wrap select{border:1px solid #e5e7eb;border-radius:6px;padding:4px 8px;font-size:13px;min-width:120px;background:#fff;outline:none;}

.btn-pipeline{padding:6px 14px;border:none;border-radius:20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;letter-spacing:0.5px;box-shadow:0 2px 8px rgba(99,102,241,0.3);transition:all .2s;}
.btn-pipeline:hover{transform:scale(1.03);box-shadow:0 4px 16px rgba(99,102,241,0.4);}
.btn-pipeline:active{transform:scale(0.97);}

/* 架构标签 — 固定于顶部 */
.arch-tab{display:flex;margin:0;border-top:1px solid #f0f0f0;}
.arch-tab-item{flex:1;text-align:center;padding:10px 2px;font-size:12px;color:#777;position:relative;cursor:pointer;border-right:1px solid #eee;background:#fafafa;}
.arch-tab-item:last-child{border-right:none;}
.arch-tab-item.active{background:#6366f1;color:#fff;}
.arch-tab-item.finish{background:#f0fdf4;}
.arch-tab-item.finish::after{content:"✓";position:absolute;top:2px;right:3px;font-size:9px;color:#10b981;}
.arch-tab-item.lock{background:#f3f4f6;color:#aaa;cursor:not-allowed;}
.arch-tab-item.lock::before{content:"🔒";font-size:10px;}

/* ===== 中间滚动区（App页面主体） ===== */
.app-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 76px;}

/* 每个模块是一个"页面" */
.module-page{display:none;min-height:100%;}
.module-page.current{display:block;}

/* 阅读预览模式 */
.reader-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #f5f5f0;
  z-index: 9999;
  overflow: hidden;
}
.reader-overlay.active {
  display: flex;
  flex-direction: column;
}
.reader-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.reader-title {
  font-size: 15px;
  font-weight: 600;
  color: #1a1a1a;
}
.reader-close-btn {
  padding: 6px 14px;
  border-radius: 8px;
  background: #f3f4f6;
  color: #374151;
  border: none;
  font-size: 13px;
  cursor: pointer;
}
.reader-close-btn:active {
  background: #e5e7eb;
}
.reader-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 40px;
  -webkit-overflow-scrolling: touch;
}
.reader-text {
  max-width: 680px;
  margin: 0 auto;
  font-size: 16px;
  line-height: 1.9;
  color: #333;
  font-family: "PingFang SC", "Microsoft YaHei", serif;
  word-break: break-word;
  white-space: pre-wrap;
}
.reader-text .card-header {
  font-size: 18px;
  font-weight: 700;
  color: #1a1a1a;
  margin: 24px 0 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid #6366f1;
}
.reader-text .card-header:first-child {
  margin-top: 0;
}

/* 构思输入区 */
.idea-bar{background:#fffbeb;border:1px solid #fef3c7;border-radius:10px;margin:0 12px 10px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
.idea-bar textarea{flex:1;border:none;outline:none;background:transparent;font-size:13px;line-height:1.5;resize:none;min-height:36px;max-height:72px;color:#333;}
.idea-bar textarea::placeholder{color:#d4a574;}
.idea-bar .speech-btn{padding:6px 10px;border-radius:8px;background:#6366f1;color:#fff;border:none;font-size:13px;cursor:pointer;flex-shrink:0;}
.idea-bar .speech-btn.recording{background:#ef4444;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* 平台选择 */
.page-pf-selector{display:flex;gap:6px;margin:0 12px 10px;font-size:12px;align-items:center;}
.page-pf-selector .pf-item{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid #eee;background:#fff;color:#666;}
.page-pf-selector .pf-item.active{background:#6366f1;color:#fff;border-color:#6366f1;}

/* 数量选择 */
.page-count-selector{display:flex;align-items:center;gap:8px;margin:0 12px 10px;font-size:13px;color:#666;}

/* 操作按钮 */
.page-actions{display:flex;gap:8px;margin:0 12px 10px;flex-wrap:wrap;}
.page-actions .main-btn{flex:1;min-width:80px;padding:9px 0;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;font-size:13px;cursor:pointer;}
.page-actions .sec-btn{padding:9px 12px;border-radius:8px;background:#eee;color:#666;border:none;font-size:13px;cursor:pointer;white-space:nowrap;}

/* 进度条 */
.page-progress{display:none;margin:0 12px 10px;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #eef0f5;}
.page-progress .prog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.page-progress .prog-title{font-size:12px;color:#6366f1;font-weight:600;}
.page-progress .prog-cancel{padding:2px 10px;border:1px solid #ef4444;border-radius:5px;background:#fff;color:#ef4444;font-size:11px;cursor:pointer;}
.page-progress .prog-bg-btn{padding:2px 10px;border:1px solid #6366f1;border-radius:5px;background:#eef0ff;color:#6366f1;font-size:11px;cursor:pointer;}
#bg-gen-indicator{transition:all 0.3s;}
.page-progress .prog-bar-wrap{background:#eee;border-radius:8px;height:6px;overflow:hidden;}
.page-progress .prog-bar{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);width:0%;border-radius:8px;transition:width 0.5s ease;}
.page-progress .prog-bar.working{animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.page-progress .prog-bar.working{background:linear-gradient(90deg,#6366f1 25%,#a78bfa 50%,#6366f1 75%);background-size:200% 100%;}
.page-progress .prog-info{display:flex;justify-content:space-between;margin-top:3px;font-size:10px;color:#999;}

/* 前置预览条 */
.preview-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;margin:0 12px 8px;background:#fffbeb;border:1px solid #fef3c7;border-radius:8px;cursor:pointer;font-size:12px;color:#b45309;}
.preview-body{display:none;margin:0 12px 10px;padding:8px 12px;background:#fff;border:1px solid #f0f0f0;border-radius:8px;font-size:12px;line-height:1.6;color:#555;max-height:180px;overflow-y:auto;white-space:pre-wrap;}

/* 内容区 — 填满剩余空间，可滚动 */
.module-content{background:#fff;border-radius:10px;margin:0 12px 20px;border:1px solid #f0f0f0;overflow:hidden;}
.module-content .raw-area{padding:10px 12px;}
.module-content .raw-area textarea{width:100%;min-height:360px;border:none;outline:none;font-size:13px;line-height:1.6;resize:vertical;background:transparent;color:#333;overflow-y:auto;}
.detail-pager,.arch-display-pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px 10px;background:#fafbff;border-top:1px solid #eee;flex-wrap:wrap;}
.detail-pager .pager-btn,.arch-display-pager .pager-btn{padding:4px 12px;border:1px solid #6366f1;border-radius:6px;background:#fff;color:#6366f1;font-size:12px;cursor:pointer;}
.detail-pager .pager-btn:disabled,.arch-display-pager .pager-btn:disabled{opacity:0.35;cursor:default;}
.detail-pager .pager-info,.arch-display-pager .pager-info{font-size:11px;color:#999;min-width:120px;text-align:center;}
.arch-display-pager .pager-btn.strong{background:#6366f1;color:#fff;}

/* 卷选卡片 */
.vol-cards{margin:0 12px 10px;}
.vol-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer;background:#fff;margin-bottom:5px;transition:all 0.15s;}
.vol-card.checked{border-color:#6366f1;background:#f0f2ff;}
.vol-card input{accent-color:#6366f1;width:16px;height:16px;flex-shrink:0;margin:0;}
.vol-card .vc-info{flex:1;min-width:0;}
.vol-card .vc-name{font-size:13px;font-weight:600;color:#1a1a2e;}
.vol-card .vc-desc{font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vol-card .vc-ch{font-size:11px;font-weight:700;color:#6366f1;background:#eef2ff;padding:2px 8px;border-radius:6px;flex-shrink:0;}
.vol-override{font-size:11px;color:#999;margin:0 12px 8px;}

/* 导入区 */
.import-area{margin:0 12px 10px;background:#fff;border-radius:10px;padding:12px;border:1px solid #e5e7eb;}
.import-area .label{font-size:13px;font-weight:600;color:#333;margin-bottom:6px;}
.import-area textarea{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:8px;font-size:12px;min-height:60px;resize:vertical;background:#f9f9f9;outline:none;line-height:1.5;}
.import-area textarea:focus{border-color:#6366f1;}
.import-btns{display:flex;gap:6px;margin-top:6px;}
.import-btns button{flex:1;padding:6px;border-radius:6px;border:none;font-size:12px;cursor:pointer;}
.import-btns .btn-primary{background:#6366f1;color:#fff;}
.import-btns .btn-secondary{background:#f1f5f9;color:#666;}

/* API 警告 */
.api-warn{display:none;margin:0 12px 8px;padding:8px 12px;background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;font-size:12px;color:#92400e;}

/* ===== 底部导航 ===== */
.tab-bar{flex-shrink:0;position:fixed;left:0;right:0;bottom:0;height:60px;background:#fff;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -1px 4px rgba(0,0,0,0.06);padding-bottom:env(safe-area-inset-bottom,0px);z-index:100;}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#999;cursor:pointer;flex:1;padding:4px 0;}
.tab-item.active{color:#6366f1;}
.tab-item .tab-icon{font-size:20px;line-height:1;}

/* Toast */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;}
.toast.show{opacity:1;}

/* loading */
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,0.8);z-index:99999;}

/* 右键菜单 */
.rmenu{position:fixed;top:70px;right:0;background:#fff;border-radius:0 0 0 12px;box-shadow:0 2px 12px rgba(0,0,0,0.15);z-index:200;display:none;min-width:140px;}
.rmenu.show{display:block;}
.ritem{display:block;width:100%;padding:12px 14px;border:none;background:none;font-size:13px;color:#333;text-align:left;cursor:pointer;border-bottom:1px solid #f0f0f0;}
.ritem:last-child{border-bottom:none;}

/* 保存确认弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;align-items:center;justify-content:center;}
.modal-overlay .modal-card{background:#fff;border-radius:16px;padding:20px;width:85%;max-width:300px;text-align:center;}
.modal-overlay .modal-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.modal-overlay .modal-desc{font-size:13px;color:#666;margin-bottom:14px;}
.modal-overlay .modal-btns{display:flex;gap:8px;}
.modal-overlay .modal-btns button{flex:1;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;}
.modal-overlay .modal-btns .btn-cancel{border:1px solid #e5e7eb;background:#fff;}
.modal-overlay .modal-btns .btn-confirm{border:none;background:#6366f1;color:#fff;}

/* 卡片表单复用 */
.card-form h3{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #f0f0f0;}
.cf-section{margin-bottom:10px;background:#f9f9fb;border-radius:8px;padding:8px;border:1px solid #eef0f5;}
.cf-label{font-size:12px;font-weight:600;color:#6366f1;margin-bottom:6px;}
.cf-row{margin-bottom:6px;}
.cf-row label{display:block;font-size:11px;color:#888;margin-bottom:2px;}
.cf-row-inline{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.cf-row-inline label{font-size:11px;color:#888;white-space:nowrap;}
.cf-input{width:100%;padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;outline:none;background:#fff;}
.cf-input:focus{border-color:#6366f1;}
.cf-input-sm{flex:1;min-width:50px;padding:5px 6px;border:1px solid #e5e7eb;border-radius:5px;font-size:11px;outline:none;background:#fff;}
.cf-input-sm:focus{border-color:#6366f1;}
.cf-textarea{width:100%;min-height:50px;padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;outline:none;resize:vertical;background:#fff;line-height:1.5;}
.cf-textarea:focus{border-color:#6366f1;}
.cf-select{padding:4px 6px;border:1px solid #e5e7eb;border-radius:5px;font-size:11px;outline:none;background:#fff;}
.cf-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.cf-chip{padding:3px 10px;background:#f0f2ff;color:#6366f1;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid transparent;user-select:none;}
.cf-chip.active{background:#6366f1;color:#fff;border-color:#6366f1;}
.cf-add-btn{padding:4px 10px;background:#6366f1;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;}

/* ===== 四级导航样式 ===== */
.level-view{display:none;flex-direction:column;flex:1;overflow:hidden;}
.level-view.active{display:flex;}

/* 面包屑导航 */
.breadcrumb{display:flex;align-items:center;padding:8px 16px;background:#fff;border-bottom:1px solid #f0f0f0;flex-shrink:0;gap:4px;font-size:12px;color:#999;overflow-x:auto;white-space:nowrap;}
.breadcrumb .bc-item{cursor:pointer;color:#6366f1;transition:color .2s;}
.breadcrumb .bc-item:hover{color:#4f46e5;}
.breadcrumb .bc-sep{color:#d1d5db;margin:0 2px;}
.breadcrumb .bc-current{color:#333;font-weight:600;cursor:default;}

/* 一级：架构设计入口 */
.level1-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.level1-body .l1-icon{font-size:64px;margin-bottom:16px;line-height:1;}
.level1-body .l1-title{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:8px;}
.level1-body .l1-desc{font-size:14px;color:#6b7280;line-height:1.6;margin-bottom:24px;max-width:300px;}
.level1-body .l1-start{padding:14px 40px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(99,102,241,.3);transition:all .2s;}
.level1-body .l1-start:active{transform:scale(.96);box-shadow:0 2px 8px rgba(99,102,241,.2);}

/* 二级：选择作品 */
.level2-body{flex:1;overflow-y:auto;padding:12px 16px 76px;-webkit-overflow-scrolling:touch;}
.work-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.work-card:active{background:#f0f2ff;border-color:#6366f1;transform:scale(.98);}
.work-card .wc-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;}
.work-card .wc-info{flex:1;min-width:0;}
.work-card .wc-title{font-size:15px;font-weight:600;color:#1a1a2e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px;}
.work-card .wc-meta{font-size:12px;color:#9ca3af;}
.work-card .wc-arrow{color:#d1d5db;font-size:16px;}
.work-card .wc-progress{display:flex;gap:4px;margin-top:4px;}
.work-card .wc-progress .prog-dot{width:8px;height:8px;border-radius:50%;background:#e5e7eb;}
.work-card .wc-progress .prog-dot.done{background:#10b981;}
.work-card .wc-progress .prog-dot.current{background:#6366f1;}
.level2-empty{text-align:center;padding:60px 20px;color:#9ca3af;}
.level2-empty .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.level2-empty .empty-text{font-size:14px;line-height:1.6;margin-bottom:16px;}
.level2-empty .empty-btn{display:inline-block;padding:10px 24px;border-radius:10px;background:#6366f1;color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;}

/* 三级：模块选择 */
.level3-body{flex:1;overflow-y:auto;padding:12px 16px 76px;-webkit-overflow-scrolling:touch;}
.level3-work-info{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f0f2ff;border-radius:10px;margin-bottom:12px;font-size:13px;color:#6366f1;font-weight:500;}
.module-card{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.module-card:active{background:#f0f2ff;border-color:#6366f1;transform:scale(.98);}
.module-card .mc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.module-card .mc-icon.world-icon{background:#eff6ff;color:#2563eb;}
.module-card .mc-icon.chars-icon{background:#fdf4ff;color:#9333ea;}
.module-card .mc-icon.outline-icon{background:#ecfdf5;color:#059669;}
.module-card .mc-icon.detail-icon{background:#fffbeb;color:#d97706;}
.module-card .mc-info{flex:1;min-width:0;}
.module-card .mc-title{font-size:15px;font-weight:600;color:#1a1a2e;margin-bottom:2px;}
.module-card .mc-desc{font-size:12px;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.module-card .mc-status{font-size:11px;padding:3px 8px;border-radius:10px;flex-shrink:0;font-weight:500;}
.module-card .mc-status.pending{background:#f3f4f6;color:#9ca3af;}
.module-card .mc-status.done{background:#ecfdf5;color:#10b981;}
.module-card .mc-status.locked{background:#fef3c7;color:#d97706;}
.module-card .mc-arrow{color:#d1d5db;font-size:16px;}

/* 四级：AI生成页 */
.level4-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0;}
.level4-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #f0f0f0;flex-shrink:0;}
.level4-header .l4-back{background:none;border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:#666;font-family:inherit;}
.level4-header .l4-back:active{background:#f3f4f6;}
.level4-header .l4-title{flex:1;font-size:14px;font-weight:600;color:#1a1a2e;text-align:center;}
.level4-header .l4-action{font-size:13px;color:#6366f1;cursor:pointer;font-weight:500;}
</style>
</head>
<body>

<!-- ===== 固定顶部 ===== -->
<div class="top-shell">
  <div class="page-header">
    <div class="back-btn" id="global-back-btn" onclick="handleGlobalBack()">‹</div>
    <div class="page-title" id="global-page-title">架构设计</div>
    <span style="font-size:10px;color:#ccc;margin-right:4px;">v66</span>
    <div class="more-btn" onclick="showRMenu()">⋯</div>
  </div>
  <!-- 面包屑导航 -->
  <div class="breadcrumb" id="breadcrumb">
    <span class="bc-item" onclick="goToLevel(1)">架构设计</span>
  </div>
  <!-- 全局进度条（四级可见） -->

<script>
// ===== 四级导航核心逻辑 =====
var _currentLevel = 1;
var _selectedWorkId = '';
var _selectedModule = 'world';

var MODULE_INFO = {
  world:   { name: '世界观', icon: '🌍', iconClass: 'world-icon', desc: '时代背景、地理、势力、力量体系' },
  chars:   { name: '人物人设', icon: '👤', iconClass: 'chars-icon', desc: '主角、配角、反派、人物关系' },
  outline: { name: '全书大纲', icon: '📋', iconClass: 'outline-icon', desc: '主线结构、卷章划分、转折点' },
  detail:  { name: '章节细纲', icon: '📑', iconClass: 'detail-icon', desc: '逐章场景、剧情节点、爆点设计' }
};

// 导航到指定级别
function goToLevel(level, opts) {
  opts = opts || {};
  _currentLevel = level;

  // 隐藏所有级别
  for (var i = 1; i <= 4; i++) {
    var el = document.getElementById('level' + i);
    if (el) el.classList.toggle('active', i === level);
  }

  // 更新面包屑
  updateBreadcrumb();

  // 更新顶部标题和返回按钮
  var backBtn = document.getElementById('global-back-btn');
  var pageTitle = document.getElementById('global-page-title');

  if (level === 1) {
    backBtn.onclick = function(){ location.href = 'index.html'; };
    pageTitle.textContent = '架构设计';
  } else {
    backBtn.onclick = handleGlobalBack;
    if (level === 2) pageTitle.textContent = '选择作品';
    else if (level === 3) {
      var w = getWorkById(_selectedWorkId);
      pageTitle.textContent = w ? w.title : '模块选择';
    }
    else if (level === 4) {
      var mi = MODULE_INFO[_selectedModule];
      pageTitle.textContent = mi ? mi.name : 'AI生成';
    }
  }

  // 渲染各级内容
  if (level === 1) renderLevel1();
  if (level === 2) renderLevel2();
  if (level === 3) renderLevel3();
  if (level === 4) renderLevel4();
}

// 全局返回
function handleGlobalBack() {
  if (_currentLevel > 1) goToLevel(_currentLevel - 1);
  else location.href = 'index.html';
}

// 更新面包屑
function updateBreadcrumb() {
  var bc = document.getElementById('breadcrumb');
  var html = '<span class="bc-item" onclick="goToLevel(1)">架构设计</span>';

  if (_currentLevel >= 2) {
    html += '<span class="bc-sep">›</span>';
    html += '<span class="bc-item" onclick="goToLevel(2)">选择作品</span>';
  }
  if (_currentLevel >= 3) {
    var w = getWorkById(_selectedWorkId);
    html += '<span class="bc-sep">›</span>';
    html += '<span class="bc-item" onclick="goToLevel(3)">' + he(w ? w.title : '模块选择') + '</span>';
  }
  if (_currentLevel >= 4) {
    var mi = MODULE_INFO[_selectedModule];
    html += '<span class="bc-sep">›</span>';
    html += '<span class="bc-current">' + (mi ? mi.name : 'AI生成') + '</span>';
  }

  bc.innerHTML = html;
}

// 获取作品
function getWorkById(id) {
  if (!id) return null;
  return (DB.works || []).find(function(w){ return w.id === id; });
}

// ===== 一级：架构设计入口 =====
function renderLevel1() {
}

// ===== 二级：选择作品 =====
function renderLevel2() {
  var works = DB.works || [];
  var body = document.getElementById('level2-body');

  if (works.length === 0) {
    body.innerHTML = '<div class="level2-empty">' +
      '<div class="empty-icon">📝</div>' +
      '<div class="empty-text">还没有作品<br>先去创建一部吧</div>' +
      '<a class="empty-btn" href="new-book.html">新建作品</a>' +
      '</div>';
    return;
  }

  var html = '';
  works.forEach(function(w) {
    var wc = 0, chCount = 0;
    (w.chapters || []).forEach(function(ch){ chCount++; wc += (ch.content || '').length; });
    // 计算架构完成度
    var archStatus = w.archStatus || {};
    var doneCount = 0;
    if (w.world) doneCount++;
    if (w.chars) doneCount++;
    if (w.outline) doneCount++;
    if (w.detail) doneCount++;

    html += '<div class="work-card" onclick="selectWork(\'' + he(w.id) + '\')">';
    html += '<div class="wc-icon">📖</div>';
    html += '<div class="wc-info">';
    html += '<div class="wc-title">' + he(w.title || '未命名') + '</div>';
    html += '<div class="wc-meta">' + chCount + '章 · 约' + wc + '字</div>';
    html += '<div class="wc-progress">';
    html += '<div class="prog-dot' + (w.world ? ' done' : '') + '"></div>';
    html += '<div class="prog-dot' + (w.chars ? ' done' : '') + '"></div>';
    html += '<div class="prog-dot' + (w.outline ? ' done' : '') + '"></div>';
    html += '<div class="prog-dot' + (w.detail ? ' done' : '') + '"></div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="wc-arrow">›</div>';
    html += '</div>';
  });

  body.innerHTML = html;
}

function selectWork(workId) {
  _selectedWorkId = workId;
  localStorage.setItem('last_edit_work', workId);
  goToLevel(3);
}

// ===== 三级：模块选择 =====
function renderLevel3() {
  var w = getWorkById(_selectedWorkId);
  if (!w) { goToLevel(2); return; }

  // 更新作品信息
  var infoEl = document.getElementById('level3-work-info');
  if (infoEl) infoEl.innerHTML = '📖 当前作品：' + he(w.title || '未命名');

  var modulesEl = document.getElementById('level3-modules');
  var html = '';

  // 一键全部生成按钮
  html += '<button class="btn-pipeline" style="width:100%;margin-bottom:12px;padding:12px;" onclick="generateAllPipeline()" title="4位AI专家协作：世界观→人设→大纲→细纲 全自动生成">🚀 一键全部生成</button>';

  var moduleKeys = ['world', 'chars', 'outline', 'detail'];
  moduleKeys.forEach(function(key) {
    var mi = MODULE_INFO[key];
    var hasContent = !!(w[key]);
    var statusClass = hasContent ? 'done' : 'pending';
    var statusText = hasContent ? '已完成' : '未生成';

    html += '<div class="module-card" onclick="selectModule(\'' + key + '\')">';
    html += '<div class="mc-icon ' + mi.iconClass + '">' + mi.icon + '</div>';
    html += '<div class="mc-info">';
    html += '<div class="mc-title">' + mi.name + '</div>';
    html += '<div class="mc-desc">' + mi.desc + '</div>';
    html += '</div>';
    html += '<span class="mc-status ' + statusClass + '">' + statusText + '</span>';
    html += '<div class="mc-arrow">›</div>';
    html += '</div>';
  });

  modulesEl.innerHTML = html;
}

function selectModule(module) {
  _selectedModule = module;
  goToLevel(4);
}

// ===== 四级：AI生成页 =====
function renderLevel4() {
  var mi = MODULE_INFO[_selectedModule];
  var titleEl = document.getElementById('level4-title');
  if (titleEl && mi) titleEl.textContent = mi.name;

  // 切换到对应的 module-page
  switchArchModule(_selectedModule);

// 格式化阅读内容：识别卡片/章节标题，加粗显示
function formatReaderContent(content, module) {
  if (!content) return '<p style="color:#999;text-align:center;padding:40px;">暂无内容</p>';

  // 移除首尾空白
  content = content.replace(/^\s+|\s+$/g, '');

  // 按换行分割，处理每个卡片/章节区块
  var lines = content.split('\n');
  var html = '';
  var inCard = false;
  var cardTitle = '';
  var cardBody = [];
  var currentSection = '';

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    // 跳过空行但保留段落分隔
    if (!trimmed) {
      cardBody.push('');
      continue;
    }

    // 检测卡片/章节标题（各种可能的格式）
    var isTitle = false;
    var titleText = '';

    // 格式1: ## 标题 或 # 标题
    var hashMatch = trimmed.match(/^(#{1,3})\s+(.+)/);
    if (hashMatch) {
      isTitle = true;
      titleText = hashMatch[2];
    }
    // 格式2: 【标题】或【标题】（无空格也行）
    if (!isTitle) {
      var bracketMatch = trimmed.match(/^[\[【]\s*(.+?)\s*[\]】]$/);
      if (bracketMatch && bracketMatch[1].length > 2 && bracketMatch[1].length < 60) {
        isTitle = true;
        titleText = bracketMatch[1];
      }
    }
    // 格式3: 第X章 《标题》或 第X卷
    if (!isTitle) {
      var chapterMatch = trimmed.match(/^(第[一二三四五六七八九十百千万\d]+[章节卷部篇]|卷\s*\d+|Chapter\s*\d+)\s*[《"<]?(.+?)[》">]?$/i);
      if (chapterMatch) {
        isTitle = true;
        titleText = chapterMatch[0];
      }
    }
    // 格式4: 以特殊符号开头的行（如 ----、====、●●、■、►）
    if (!isTitle) {
      var symbolMatch = trimmed.match(/^([=─—━▪●■►▼△▽★☆◆◇○●◆■▲■►▸▔▼▄▀▬─_]{2,})\s*(.*)/);
      if (symbolMatch) {
        isTitle = symbolMatch[2].trim().length > 0;
        titleText = symbolMatch[2].trim();
      }
    }
    // 格式5: 全部大写或以特定关键词开头的行
    if (!isTitle && (trimmed === trimmed.toUpperCase()) && trimmed.length < 40 && trimmed.length > 2) {
      // 全大写且短，可能是标题
      if (/[\u4e00-\u9fa5]/.test(trimmed)) {
        isTitle = true;
        titleText = trimmed;
      }
    }

    if (isTitle && titleText) {
      // 输出之前的卡片内容
      if (cardBody.length > 0) {
        html += '<div class="card-block">' + cardBody.join('<br>').replace(/<br><br><br>/g, '<br><br>') + '</div>';
        cardBody = [];
      }
      // 输出新卡片标题
      html += '<div class="card-header">' + escapeHtml(titleText) + '</div>';
    } else {
      cardBody.push(escapeHtml(trimmed));
    }
  }

  // 输出最后一张卡片
  if (cardBody.length > 0) {
    html += '<div class="card-block">' + cardBody.join('<br>').replace(/<br><br><br>/g, '<br><br>') + '</div>';
  }

  // 如果没有格式化出标题（纯文本），直接显示
  if (!html || html.indexOf('card-header') === -1) {
    html = '<div class="card-block">' + escapeHtml(content).replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>') + '</div>';
  }

  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
}

function getCurrentWork(){
  try{
    var works = (typeof DB !== 'undefined' && DB.works) ? DB.works : [];
    if(_selectedWorkId){
      var w = works.find(function(x){ return x.id === _selectedWorkId; });
      if(w) return w;
    }
    var lastId = localStorage.getItem('last_edit_work');
    if(lastId){
      var w2 = works.find(function(x){ return x.id === lastId; });
      if(w2) return w2;
    }
    return works.length ? works[works.length-1] : null;
  }catch(e){ return null; }
}

  try{

    if(!work) return;
    work._moduleIdeas = work._moduleIdeas || {};
    work._moduleIdeas[module] = text;
    if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work);
  }catch(e){}
}

// 获取白金作家创作法则提示（随机选取9-11条注入）
function getPlatinumRulesHint(){
  var keys = Object.keys(PLATINUM_RULES);
  var selected = [];
  // 必选：冰山对话3条 + 禁读心 + 视角锁 + 句式节奏 + 标点节奏 + 延迟释放 + 目标感 + 章末钩子 + 正文公式 + 地文对话循环（2026核心12条）
  var mustSelect = ['iceberg_dialogue', 'iceberg_micro_action', 'iceberg_answer_nonanswer', 'no_mind_reading', 'perspective_locked', 'perspective_switch', 'sentence_rhythm', 'punctuation_rhythm', 'emotion_delay', 'target_sense', 'hook', 'chapter_formula', 'ground_dialogue_cycle'];
  for(var i = 0; i < mustSelect.length; i++){
    if(PLATINUM_RULES[mustSelect[i]]) selected.push(PLATINUM_RULES[mustSelect[i]]);
  }
  // 随机选3-4条补充
  var remaining = keys.filter(function(k){ return mustSelect.indexOf(k) === -1; });
  var addCount = 3 + Math.floor(Math.random() * 2);
  for(var j = 0; j < addCount && remaining.length > 0; j++){
    var idx = Math.floor(Math.random() * remaining.length);
    selected.push(PLATINUM_RULES[remaining[idx]]);
    remaining.splice(idx, 1);
  }
  return selected.join('\n');
}

// 获取 2026 题材趋势提示（根据作品题材自动匹配）
function getTrendHint2026(work){
  var genre = '';
  try{
    if(work && work.genre) genre = work.genre;
    else if(work && work.category && work.category.cat1) genre = work.category.cat1;
  }catch(e){}
  if(!genre) return TREND_2026['default'];
  for(var k in TREND_2026){
    if(k !== 'default' && genre.indexOf(k) >= 0) return TREND_2026[k];
  }
  return TREND_2026['default'];
}

// v48: 辅助工具 —— 智能截断（保留完整段落，避免中段切断）
function smartTruncate(text, maxLen){
  if(!text) return '';
  if(text.length <= maxLen) return text;
  var head = text.substring(0, maxLen);
  // 找最后一个句号/换行/■ 作为截断点（在 70% 之后的位置最安全）
  var searchStart = Math.floor(maxLen * 0.6);
  var cutPoints = [
    head.lastIndexOf('\n', maxLen),
    head.lastIndexOf('。', maxLen),
    head.lastIndexOf('■', maxLen),
    head.lastIndexOf('；', maxLen)
  ];
  var bestCut = Math.max.apply(null, cutPoints);
  if(bestCut > searchStart) return head.substring(0, bestCut + 1) + '\n...（后续略）';
  return head + '...（后续略）';
}

// ========== 核心：架构模块生成主函数 ==========
// v48: 支持 extraHint（针对性加强提示），调用前后统一清理对话语前缀
window.generateArchModule = async function(opts){
  opts = opts || {};
  try{
    var module = _selectedModule || 'world';
    var work = getCurrentWork();
    if(!work){
      showToast('请先选择一部作品', {error:true});
      goToLevel(2);
      return;
    }

    // 1. 读取用户输入的提示词（优先级最高）
    var ideaEl = document.getElementById('idea-' + module);
    var idea = ideaEl ? ideaEl.value : '';
    if(idea && idea.trim()){
      saveModuleIdea(module, idea.trim());
    }

    // 2. 显示进度
    var moduleName = MODULE_INFO[module] ? MODULE_INFO[module].name : module;
    var actionLabel = opts.isFix ? '按评价重新生成' : 'AI生成';
    if(typeof showLoading === 'function') showLoading(actionLabel + moduleName + '中…');
    if(!idea.trim() && !opts.isFix){
      showToast('已按作品题材自动生成。你也可以在上方输入具体要求，AI 会优先按你的提示词生成。', {duration:3000});
    }

    // 3. v48: 卡片分批生成（替代自动续写，每批独立调用，天然不截断且一致性好）
    var taskType = 'default';
    if(module === 'world') taskType = 'world_rules';
    else if(module === 'chars') taskType = 'chars_core';
    else if(module === 'outline') taskType = 'outline_logic';
    else if(module === 'detail') taskType = 'detail_base';

    // 4a. 根据模块类型拆分卡片
    var batches = buildArchCardBatchesV48(module, work, idea);
    var totalChars = 0;
    var allCards = [];

    // 4b. 逐卡片生成（每张卡片独立调用 AI，上下文包含已生成内容作为一致性锚点）
    for(var bi = 0; bi < batches.length; bi++){
      var card = batches[bi];
      var progressLabel = '[' + (bi+1) + '/' + batches.length + '] ' + card.label;
      var progressPct = Math.round((bi / batches.length) * 90); // 0-90% 留10%给完成

      if(typeof showLoading === 'function'){
        showLoading('正在生成 ' + moduleName + ' · ' + progressLabel);
      }
      if(typeof updateLoadingProgress === 'function'){
        updateLoadingProgress(progressPct, '正在生成 ' + moduleName + ' · ' + progressLabel);
      }

      // 构建本卡片的 prompt：核心诉求 + 已生成内容（作为锚点）+ 本卡片具体目标 + 评价加强提示
      var cardPrompt = buildArchCardPromptV48(module, card, work, idea, allCards, opts && opts.extraHint);
      var cardTargetChars = card.targetChars || 800;

      var cardResult = null;
      try{
        if(typeof callRealAPIWithFallback === 'function'){
          cardResult = await callRealAPIWithFallback(cardPrompt, null, taskType, cardTargetChars);
        } else if(typeof callRealAPI === 'function'){
          cardResult = await callRealAPI(cardPrompt, null, {});
        }
      }catch(e){
        console.warn('卡片 ' + card.label + ' 生成失败:', e);
        cardResult = '（本卡片生成失败）\n';
      }

      if(!cardResult || !cardResult.trim()){
        // 某张卡片失败也不中断，后面用户可以手动补
        cardResult = '（本卡片生成失败，请重试）\n';
      }

      allCards.push({ label: card.label, content: cardResult });
      totalChars += cardResult.length;

      // 卡片间极短等待，避免触发服务商 API 速率限制
      if(bi < batches.length - 1){
        await new Promise(function(res){ setTimeout(res, 50); });
      }
    }

    // 4c. 合并所有卡片为完整结果
    var result = '';
    for(var ci = 0; ci < allCards.length; ci++){
      var c = allCards[ci];
      var header = '';
      if(batches.length > 1){
        header = '【' + c.label + '】\n';
      }
      result += header + c.content.trim() + '\n\n';
    }
    result = result.trim();

    if(!result || totalChars < 100){
      if(typeof hideLoading === 'function') hideLoading();
      showToast('⚠️ 生成失败，请检查 API 设置后重试', {error:true, duration:4000});
      return;
    }

    // 5. 写入编辑区 + 保存到作品
    var rawEl = document.getElementById('raw-' + module);
    if(rawEl){
      rawEl.value = result;
      rawEl.style.height = 'auto';
      rawEl.style.height = Math.max(360, Math.min(rawEl.scrollHeight + 24, 2400)) + 'px';
    }
    work[module] = result;
    try{ if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work); }catch(e){}

    if(typeof hideLoading === 'function') hideLoading();
    var completionMsg = '✅ ' + moduleName + ' 生成完成（' + batches.length + ' 张卡片 · ' + result.length + '字）';
    completionMsg += '。建议点"评价"检查质量。';
    showToast(completionMsg, {duration:4000});
  } catch(err){
    if(typeof hideLoading === 'function') hideLoading();
    console.error('generateArchModule error:', err);
    showToast('生成异常：' + (err && err.message ? err.message : err), {error:true, duration:5000});
  }
};

      focus: '世界观矛盾与钩子 — 核心矛盾（表层矛盾：谁和谁打+为什么；深层矛盾：真正的原因是什么，99%的人不知道）、势力间的利益冲突与暗流（至少3条暗线）、世界观级悬念钩子（至少5个未解之谜，每个标注谁在追查、预计何时揭晓）、主角与世界规则的冲突点（主角为什么是打破规则的人）、世界即将面临的变局（大事件即将发生，改变一切）'
    });
  } else if(module === 'chars'){

    batches.push({

    });
    batches.push({

      focus: '主角成长轨迹 — 开局状态（他一无所有/被压制/被误解的具体处境）、第1次觉醒（什么事件触发、他获得了什么、付出了什么代价）、第1次挫折（他失败在哪里、如何爬起来、心态变化）、第1次重大选择（两难抉择，无论选什么都失去重要的东西）、中期转折（他发现自己一直被蒙蔽/利用）、后期蜕变（他真正成为什么样的人，和开局的反差）、最终结局（他得到了什么、失去了什么、他是否还是原来的自己）'
    });

    });
    batches.push({
      label: '反派·手下与暗线',

    });

    });
    batches.push({
      label: '关键配角（对手系）+ 关系网',
      targetChars: 3000,

    });
  } else if(module === 'outline'){

    });
    var vols = [
      { num: '1-2', label: '第 1-2 卷（起势期）', totalHint: '起势期' },
      { num: '3-4', label: '第 3-4 卷（上升期）', totalHint: '上升期' },
      { num: '5-6', label: '第 5-6 卷（转折期）', totalHint: '转折期' },
      { num: '7-8', label: '第 7-8 卷（高潮期）', totalHint: '高潮期' }

        position: vols[vi].totalHint
      });
    }
    batches.push({
      label: '终卷（第9卷·大结局）',
      targetChars: 3000,
      focus: '第9卷（终局）：最终决战的前夜（主角做了什么准备、心理状态如何）、终极对决（对手是谁、在哪打、怎么赢的、赢的代价是什么）、所有伏笔回收（列出前8卷埋下的每条伏笔如何在本卷揭晓）、每个主要角色的结局（他们最终变成了什么样、得到了什么失去了什么）、尾声（主角最终的状态、世界变成了什么样、最后一个画面是什么）、读者读完最后一行应该是什么感受'
    });
  } else if(module === 'detail'){
    // 细纲：5 张卡片，每3章为一批，极度精细
    var ranges = [
      { start: 1, end: 3 },
      { start: 4, end: 6 },
      { start: 7, end: 9 },
      { start: 10, end: 12 },
      { start: 13, end: 15 }
    ];
    for(var di = 0; di < ranges.length; di++){
      var r = ranges[di];
      batches.push({
        label: '第 ' + r.start + '-' + r.end + ' 章',
        targetChars: 4000,
        focus: '细纲：第 ' + r.start + ' 到第 ' + r.end + ' 章（共 ' + (r.end - r.start + 1) + ' 章）。每章格式严格为：\n■ 第N章《标题》\n场景：具体地点+时间+氛围\n人物：出场角色（标注谁是视角人物）\n开场画面：用一个感官细节开场\n剧情节点（必须含起承转合4个节点，每个节点写清：发生了什么→角色反应→推动什么变化）\n对话亮点：本章最精彩的一句对话\n爽点/虐点：具体是什么、读者情绪如何被调动\n爆点/悬念钩子：章末留下什么让读者必须翻下一章\n伏笔：本章埋了什么暗线（标注预计何时回收）\n章与章之间要有因果推进，每3章设计一个重大转折点并标注【重大转折】。每章至少包含1个信息推进点和1个情绪刺激点。',
        chapterRange: r
      });
    }
  } else {
    // 其他未知模块：默认 1 张卡片
    batches.push({ label: module, targetChars: 1500, focus: '完整内容' });
  }

  return batches;
}

// ===== v48: 为单张卡片构建 prompt =====
// 关键点：用户诉求 + 已生成内容（作为锚点）+ 本卡片具体目标 + 可选 extraHint（评价加强意见）
function buildArchCardPromptV48(module, card, work, idea, prevCards, extraHint){
  var moduleName = MODULE_INFO[module] ? MODULE_INFO[module].name : module;
  var title = (work && work.title) || '未命名作品';
  var genre = (work && work.genre) || (work && work.category && work.category.cat1) || '';
  var platform = '起点';
  try{ if(work && work._platform === 'fanqie') platform = '番茄'; else if(work && work._platform === 'jinjiang') platform = '晋江'; }catch(e){}

  var prompt = '你是一位资深网文架构师，擅长拆解和构建作品的世界观、人物、大纲与章节。你的设计必须服务于"能产生精彩故事"这一核心目标。\n\n';

  // 用户核心诉求放在第一位，优先级最高
  if(idea && idea.trim()){
    prompt += '【⚠️ 最高优先级·用户核心诉求 — 必须严格执行，凌驾于所有其他指令之上】\n' + idea.trim() + '\n\n';
  } else {
    prompt += '【用户核心诉求 — 本次无特殊要求，由你基于题材自由发挥】\n\n';
  }

  prompt += '【一致性铁律 — 违反任何一条即视为生成失败】\n';
  prompt += '1. 人物姓名、身份、关系必须与已有设定完全一致，不得改名、不得新增未提及的核心人物\n';
  prompt += '2. 世界观规则（力量体系、势力分布、地理名称）必须与已有设定完全一致，不得修改或矛盾\n';
  prompt += '3. 时间线必须连续，不得出现时间倒流或事件顺序矛盾\n';
  prompt += '4. 前文已确认的事实不得推翻，前文已埋的伏笔必须承接\n';
  prompt += '5. 如果本卡片内容与已有设定冲突，必须以已有设定为准，本卡片让步\n\n';

  prompt += '【作品基础信息】\n';
  prompt += '作品名称：' + title + '\n';
  if(genre) prompt += '一级题材：' + genre + '\n';
  prompt += '发布平台：' + platform + '\n\n';

  // 前置架构上下文（给本卡片作为一致性锚点，增大引用量）
  if(module !== 'world'){
    prompt += '【前置架构约束 — 必须完全遵守以下已有设定，不得出现矛盾、不得编造新的人物/势力/地名】\n';
    if(work && work.world && work.world.trim()){
      prompt += '■ 世界观（全文引用，不可遗漏）：\n' + smartTruncate(work.world, 2000) + '\n';
    }
    if(module !== 'chars' && work && work.chars && work.chars.trim()){
      prompt += '■ 人物人设（全文引用，不可遗漏）：\n' + smartTruncate(work.chars, 2000) + '\n';
    }
    if(module === 'detail' && work && work.outline && work.outline.trim()){
      prompt += '■ 全书大纲（全文引用，不可遗漏）：\n' + smartTruncate(work.outline, 2500) + '\n';
    }
    prompt += '\n';
  }

  // 2026 题材趋势（精简版）
  var trend = getTrendHint2026(work);
  if(trend){
    prompt += '【2026 年题材趋势参考 — 灵感来源，不是硬性要求】\n' + smartTruncate(trend, 400) + '\n\n';
  }

  // 关键：已生成的卡片内容（作为一致性锚点，让 AI 知道前面写了什么）
  if(prevCards && prevCards.length > 0){
    prompt += '【本模块已生成的内容 — 必须严格延续这些设定，不得重复、不得冲突、不得遗漏已提及的细节】\n';
    for(var pi = 0; pi < prevCards.length; pi++){
      var pc = prevCards[pi];
      // 每张卡片取最后 1000 字（保持一致性的同时避免超长）
      var snippet = pc.content.length > 1000 ? pc.content.slice(-1000) : pc.content;
      prompt += '■ ' + pc.label + '：\n' + snippet.trim() + '\n\n';
    }
  }

  // extraHint：来自"按评价加强"的修复意见，放在用户诉求之后、本卡片任务之前，权重高
  if(extraHint && extraHint.trim()){
    prompt += '【★ 本次生成特别关注 — 来自编辑评价的加强意见，必须优先处理】\n' + smartTruncate(extraHint.trim(), 800) + '\n\n';
  }

  // 本卡片目标
  prompt += '【本卡片任务】\n';
  prompt += '正在生成本模块中的卡片：**' + card.label + '**\n';
  prompt += '请专注于以下内容：\n' + card.focus + '\n\n';

  // 格式与字数要求
  prompt += '【⚠️ 输出格式与字数约束】\n';
  prompt += '1. 直接输出成品内容，不要加"好的/收到/以下是……"等对话语前缀\n';
  prompt += '2. 不要输出与本卡片无关的内容（如创作思路、解释说明）\n';
  prompt += '3. 段落清晰，用「■」标记关键子项\n';
  prompt += '4. **硬性字数上限：本卡片约 ' + card.targetChars + ' 字即可，严禁超额**\n';
  prompt += '5. 与已生成内容保持人物名称、设定、风格的一致性\n';
  if(module === 'detail' && card.chapterRange){
    prompt += '6. 细纲必须严格使用「■ 第N章《标题》 | 场景：xxx | 人物：xxx | 剧情节点：xxx | 爆点/悬念钩子：xxx」格式，一行一章，章节编号必须连续从 ' + card.chapterRange.start + ' 到 ' + card.chapterRange.end + '\n';
  }

  prompt += '\n【开始生成本卡片】\n';
  return prompt;
}

  try{
    var module = _selectedModule || 'world';
    var rawEl = document.getElementById('raw-' + module);
    if(!rawEl) return;
    if(!confirm('确定清空当前模块的生成内容吗？')) return;
    rawEl.value = '';

    if(work){
      work[module] = '';
      try{ if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work); }catch(e){}
    }
    showToast('已清空');
  }catch(e){ console.error(e); showToast('操作失败'); }
};

// ========== v48: 架构模块深度评价（AI 评价 + 本地启发式双路检查）==========
// 功能：分析当前模块的生成内容，输出结构化问题列表，为"按评价加强"提供修复线索
window.evaluateArchModule = async function(){
  try{
    var module = _selectedModule || 'world';
    var moduleName = MODULE_INFO[module] ? MODULE_INFO[module].name : module;
    var rawEl = document.getElementById('raw-' + module);
    if(!rawEl || !rawEl.value.trim()){
      showToast('先生成内容再评价');
      return;
    }
    var content = rawEl.value.trim();
    var len = content.length;

    // ============== 本地启发式快速检查（离线可用）==============
    var issues = [];
    var strengths = [];

    // 长度检查
    if(len < 600) issues.push('内容偏短（<600字），设定/细节可能不足');
    else if(len >= 800 && len <= 3000) strengths.push('篇幅合理');

    // AI 腔 / 模板化表达检测
    var aiPatterns = /(他的内心五味杂陈|时间仿佛静止|空气仿佛凝固|心中百感交集|众人震惊|全场震惊|一片哗然|所有人都惊呆了|命运的齿轮开始转动|仿佛是|如同是)/;
    if(aiPatterns.test(content)) issues.push('检测到 AI 腔/模板化表达（应替换为具体动作/对话）');
    else strengths.push('模板化表达少');

    // 细纲格式检查
    if(module === 'detail'){
      var chapterCount = (content.match(/第[\d一二三四五六七八九十百零两]+章/g) || []).length;
      if(chapterCount === 0) issues.push('细纲中未检测到"第N章"格式；建议明确分章');
      if(chapterCount < 5) issues.push('细纲章节数偏少（<5）；建议扩展到10-20章');
      var hasHookPattern = /(原来|其实|秘密|真正|不仅|更|可|却|谁也没想到|就在这时)/;
      if(chapterCount > 0 && !hasHookPattern.test(content)) issues.push('悬念钩子不足；每章末应有让读者想点下一章的内容');
      var pipeCount = (content.match(/\|/g) || []).length;
      if(chapterCount > 0 && pipeCount < chapterCount) issues.push('部分章节未使用"|"字段分隔符；统一格式便于后续写作');
      if(chapterCount >= 8 && pipeCount >= chapterCount) strengths.push('细纲格式规范');
    }

    // 人设检查
    if(module === 'chars'){
      if(!/反派|对手|敌人|敌对/.test(content)) issues.push('人设中未见明确的反派/敌对角色');
      var nameCount = (content.match(/[\u4e00-\u9fa5]{2,4}(?=\s*[（(]|：|:)/g) || []).length;
      if(nameCount >= 4) strengths.push('人物名识别正常');
      if(content.length < 800) issues.push('人物设定偏短；建议补充每个人物的动机/弱点/弧光起点');
    }

    // 世界观检查
    if(module === 'world'){
      if(!/(代价|限制|规则|矛盾|冲突|力量|体系|社会|势力)/.test(content)) issues.push('世界观缺少"代价/规则/矛盾/势力"等核心要素');
      if(/(四大神兽|五行|元素|斗气|魔法)/.test(content)) issues.push('使用了较泛的传统设定；建议添加独特变体以避免套路化');
    }

    // 大纲检查
    if(module === 'outline'){
      var juanCount = (content.match(/第[一二三四五六七八九十\d]+卷|卷[一二三四五六七八九十\d]+|第[一二三四五六七八九十\d]+幕/g) || []).length;
      if(juanCount === 0) issues.push('未见明确分卷结构；建议按"卷"组织全书');
      if(!/(伏笔|钩子|悬念|转折|冲突|爆点|揭示)/.test(content)) issues.push('大纲缺少伏笔/钩子/转折等结构要素');
    }

    // ============== AI 深度评价（如果可用）==============
    var aiReport = '';

// ========== v48: 细纲智能补强（卡片分批版）—— 冲突/节奏/伏笔/角色一致性全链路 ==========
// 每 5 章为一批，每批独立调用 AI，避免一次性 3000 字被截断
window.strengthenDetailOutlineV46 = async function(){
  try{
    var work = getCurrentWork();
    if(!work){ showToast('请先选择一部作品'); return; }
    if(!work.detail || !work.detail.trim()){ showToast('请先生成章节细纲'); return; }

    // 1. 先解析现有细纲，识别有多少章
    var existingChapters = parseDetailChaptersV48(work.detail);
    var totalChapters = existingChapters.length;

    // 2. 拆分卡片：每 5 章一批
    var batches = [];
    for(var ci = 0; ci < totalChapters; ci += 5){
      var endIdx = Math.min(ci + 4, totalChapters - 1);
      var startNum = ci + 1;
      var endNum = endIdx + 1;
      batches.push({
        label: '补强第 ' + startNum + '-' + endNum + ' 章',
        startIdx: ci,
        endIdx: endIdx,
        targetChars: 1000
      });
    }
    if(batches.length === 0){
      batches.push({ label: '全量补强', startIdx: 0, endIdx: totalChapters, targetChars: 1500 });
    }

    // 3. 通用上下文（给每批卡片共享）
    var contextBlock = '';
    contextBlock += '【作品题材】' + (work.genre || '未知') + '\n';
    if(work.world) contextBlock += '【世界观参考（必须严格遵守）】\n' + smartTruncate(work.world, 1000) + '\n';
    if(work.chars) contextBlock += '【人物参考（人物名必须从此列表中挑选）】\n' + smartTruncate(work.chars, 1000) + '\n';
    if(work.outline) contextBlock += '【全书大纲参考】\n' + smartTruncate(work.outline, 1200) + '\n';

    // 4. 每批卡片独立调用 AI
    var allCards = [];
    for(var bi = 0; bi < batches.length; bi++){
      var card = batches[bi];
      var progressLabel = '[' + (bi+1) + '/' + batches.length + '] ' + card.label;
      if(typeof showLoading === 'function') showLoading('细纲补强中 · ' + progressLabel);

      // 构建本批的专属 prompt
      var prompt = '你是一位擅长节奏设计的资深网文编辑。请对以下章节细纲进行"全链路质量补强"，使每一章都能驱动读者想点开下一章。\n\n';
      prompt += contextBlock + '\n';

      // 已补强的前序章节（作为一致性锚点，取最后 500 字）
      if(allCards.length > 0){
        var prevCombined = '';
        for(var pi = 0; pi < allCards.length; pi++) prevCombined += allCards[pi].content;
        prompt += '【已补强的章节（作为参考，保持风格与设定一致）】\n' + smartTruncate(prevCombined, 600) + '\n\n';
      }

      // 待补强的章节片段
      var chapterSnippet = '';
      for(var xi = card.startIdx; xi <= card.endIdx; xi++){
        if(xi < existingChapters.length) chapterSnippet += existingChapters[xi] + '\n';
      }
      prompt += '【本卡片待补强的细纲】\n' + chapterSnippet + '\n';

      // 补强要求
      prompt += '【你的补强任务】\n';
      prompt += '1. 【爆点/悬念钩子】每章末尾必须有悬念/钩子；钩子必须是"信息差"或"承诺兑现"\n';
      prompt += '2. 【转折密度】每 3-5 章有一个较大转折点，用【重大转折】标签标记\n';
      prompt += '3. 【因果推进】章节间必须有因果推进，不能是流水账\n';
      prompt += '4. 【格式严格保持】"■ 第N章《标题》|场景:|人物:|剧情节点:|爆点/悬念钩子:"\n';
      prompt += '5. 【角色名强制来源】人物名必须从【人物参考】中挑选；不得出现"一些人""某人""神秘人"等泛称——神秘人也要给外部特征描述\n';
      prompt += '6. 【场景具体化】场景不能是"山里""城里"，必须给具体位置\n';
      prompt += '7. 【剧情节点拆分】剧情节点字段分 2-3 个小节点，用"→"分隔\n';
      prompt += '8. 【伏笔体系】至少每 3 章出现一次伏笔回收或新伏笔植入，用【伏笔】标签标记\n';
      prompt += '9. 【冲突升级合理化】不能"突然出现新敌人"；新敌人必须有铺垫\n';
      prompt += '10. 【人物行为一致性】若本章角色做出违反人设的行为，必须在剧情节点中说明原因\n';
      prompt += '11. 直接输出补强后的细纲，不要加"好的/收到"等对话语\n';
      prompt += '12. 本卡片目标字数约 ' + card.targetChars + ' 字，严禁超额\n';

      var cardResult = null;
      try{
        if(typeof callRealAPIWithFallback === 'function'){
          cardResult = await callRealAPIWithFallback(prompt, null, 'detail_base', card.targetChars);
        } else if(typeof callRealAPI === 'function'){
          cardResult = await callRealAPI(prompt, null, {});
        }
      }catch(e){ console.warn('细纲补强卡片 ' + card.label + ' 失败:', e); }

      if(!cardResult || !cardResult.trim()) cardResult = '（本卡片补强失败，请重试）\n';
      allCards.push({ label: card.label, content: cardResult });

      // 卡片间极短等待，避免触发服务商 API 速率限制
      if(bi < batches.length - 1){
        await new Promise(function(res){ setTimeout(res, 50); });
      }
    }

    // 5. 合并所有卡片
    var result = '';
    for(var ci2 = 0; ci2 < allCards.length; ci2++){
      result += allCards[ci2].content.trim() + '\n';
    }
    result = result.trim();

    if(!result || result.length < 100){
      if(typeof hideLoading === 'function') hideLoading();
      showToast('补强失败，请检查 API', {error:true, duration:3500});
      return;
    }

    // 写入细纲编辑区 + 保存
    var rawEl = document.getElementById('raw-detail');
    if(rawEl){
      rawEl.value = result;
      rawEl.style.height = 'auto';
      rawEl.style.height = Math.max(360, Math.min(rawEl.scrollHeight + 24, 2400)) + 'px';
    }
    work.detail = result;
    try{ if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work); }catch(e){}
    if(typeof hideLoading === 'function') hideLoading();
    showToast('✅ 细纲补强完成（' + batches.length + ' 张卡片 · ' + result.length + '字）', {duration:3000});
  }catch(e){ console.error('strengthenDetailOutlineV46 error:', e); showToast('补强失败：' + (e.message||e), {error:true}); }
};

// ===== v48: 从细纲文本中按章节拆分 =====
function parseDetailChaptersV48(text){
  if(!text) return [];
  var lines = text.split('\n');
  var chapters = [];
  var current = '';
  for(var li = 0; li < lines.length; li++){
    var line = lines[li].trim();
    // 检测"第N章"的章节开头
    var isChapterStart = /^■?\s*第[一二三四五六七八九十百零〇\d]+章/.test(line) || /^■?\s*\d+\s*[、章.\-]/.test(line);
    if(isChapterStart && current){
      chapters.push(current.trim());
      current = line;
    } else if(isChapterStart){
      current = line;
    } else if(line){
      current += (current ? '\n' : '') + line;
    }
  }
  if(current) chapters.push(current.trim());
  return chapters;
}

// ===== v48: 从文件导入架构内容（.json/.md/.txt）=====
window.handleArchFileImport = function(event){
  try{
    var file = event.target.files && event.target.files[0];
    if(!file){ return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var text = e.target.result;
        var module = _selectedModule || 'world';
        var work = getCurrentWork();
        // 如果是 JSON 且包含对应模块字段，尝试解析
        if(file.name.toLowerCase().indexOf('.json') > -1){
          try{
            var data = JSON.parse(text);
            if(data.world || data.chars || data.outline || data.detail){
              // 批量导入
              var imported = 0;
              for(var key in data){
                if(typeof data[key] === 'string' && (key==='world'||key==='chars'||key==='outline'||key==='detail')){
                  var rawE = document.getElementById('raw-' + key);
                  if(rawE){ rawE.value = data[key]; imported++; }
                  if(work) work[key] = data[key];
                }
              }
              if(work && typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work);
              showToast('✅ 已导入 ' + imported + ' 个模块', {duration:3000});
            } else {
              // 当作纯文本导入当前模块
              var rawEl = document.getElementById('raw-' + module);
              if(rawEl) rawEl.value = text;
              if(work){ work[module] = text; if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work); }
              showToast('✅ 已导入', {duration:2000});
            }
          }catch(jsonErr){
            // JSON 解析失败，当作纯文本
            var rawEl2 = document.getElementById('raw-' + module);
            if(rawEl2) rawEl2.value = text;
            if(work){ work[module] = text; if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work); }
            showToast('✅ 已作为文本导入', {duration:2000});
          }
        } else {
          // 纯文本：导入当前模块
          var rawEl3 = document.getElementById('raw-' + module);
          if(rawEl3) rawEl3.value = text;
          if(work){ work[module] = text; if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work); }
          showToast('✅ 已导入', {duration:2000});
        }
      }catch(err){ console.error('handleArchFileImport error:',err); showToast('导入失败',{error:true}); }
    };
    reader.readAsText(file, 'UTF-8');
    // 重置 input，让同一份文件能再次被选择
    event.target.value = '';
  }catch(e){ console.error('handleArchFileImport error:',e); showToast('导入失败',{error:true}); }
};

// ===== v52: 架构展示翻页器（真正实现内容分页）=====
var _archPageMap = {};
var _archPageSize = 2000; // 每页显示字数

// 获取原始内容（从 raw textarea 或 work 对象）
function getArchRawContent(module) {
  var rawEl = document.getElementById('raw-' + module);
  if (rawEl && rawEl.value.trim()) return rawEl.value.trim();
  var work = getCurrentWork();
  if (work && work[module]) return work[module].trim();
  return '';
}

// 更新分页后的内容显示
function updateArchDisplay(module) {
  var rawEl = document.getElementById('raw-' + module);
  if (!rawEl) return;
  var content = getArchRawContent(module);
  if (!content) return;
  
  var key = module + '_page';
  var totalPages = Math.ceil(content.length / _archPageSize) || 1;
  var currentPage = Math.min(_archPageMap[key] || 1, totalPages);
  _archPageMap[key] = currentPage;
  
  // 计算当前页的内容范围
  var start = (currentPage - 1) * _archPageSize;
  var end = Math.min(start + _archPageSize, content.length);
  var pageContent = content.substring(start, end);
  
  // 更新显示（直接修改 textarea 值，或用显示层覆盖）
  // 如果有专门的显示层，用显示层；否则用 raw textarea
  var displayEl = document.getElementById('arch-display-' + module);
  if (displayEl) {
    displayEl.textContent = pageContent;
  }
  
  // 更新分页信息
  var infoEl = document.getElementById('arch-display-info-' + module);
  if (infoEl) infoEl.textContent = '第' + currentPage + '/' + totalPages + '页 (' + content.length + '字)';
  
  // 更新按钮状态
  var pager = document.getElementById('arch-display-pager-' + module);
  if (pager) {
    pager.style.display = 'flex';
    var prevBtn = pager.querySelector('.pager-btn');
    var nextBtn = pager.querySelectorAll('.pager-btn')[1];
    if (prevBtn) prevBtn.disabled = currentPage <= 1;
    if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
  }
}

window.archDisplayPrevPageV52 = function(){
  var module = _selectedModule || 'world';
  var key = module + '_page';
  var content = getArchRawContent(module);
  if (!content) return;
  var totalPages = Math.ceil(content.length / _archPageSize) || 1;
  _archPageMap[key] = Math.max(1, (_archPageMap[key] || 1) - 1);

  }
  // 隐藏分页控件
  ['world','chars','outline'].forEach(function(m){
    var pager = document.getElementById('arch-display-pager-' + m);
    if (pager) pager.style.display = 'none';
  });
  _archPageMap[module + '_page'] = 1;
};
window.archDisplayBackToPagedV52 = function(){
  var module = _selectedModule || 'world';
  var pager = document.getElementById('arch-display-pager-' + module);
  if (pager) pager.style.display = '';
  _archPageMap[module + '_page'] = 1;
  updateArchDisplay(module);
};

// 生成完成后自动启用分页显示
var _origGenerateArchModule = window.generateArchModule;
window.generateArchModule = async function(opts) {
  var result = await _origGenerateArchModule.apply(this, arguments);
  setTimeout(function() {
    var module = _selectedModule || 'world';
    var content = getArchRawContent(module);
    if (content && content.length > _archPageSize) {
      _archPageMap[module + '_page'] = 1;
      updateArchDisplay(module);
    }
  }, 100);
  return result;
};

// ===== v52: 细纲翻页器（真正实现）=====
var _detailPageIdx = 0;
var _detailPageSize = 5000; // 每批显示字数（细纲按段落）

function getDetailContent() {
  var rawEl = document.getElementById('raw-detail');
  if (rawEl && rawEl.value.trim()) return rawEl.value.trim();
  var work = getCurrentWork();
  if (work && work.detail) return work.detail.trim();
  return '';
}

function updateDetailDisplay() {
  var content = getDetailContent();
  if (!content) return;
  
  // 按章节分割（找"第N章"模式）
  var chapters = parseDetailChaptersV48(content);
  var totalBatches = Math.ceil(chapters.length / 10) || 1; // 每批10章
  var currentBatch = Math.min(_detailPageIdx + 1, totalBatches);
  
  var start = _detailPageIdx * 10;
  var end = Math.min(start + 10, chapters.length);
  var batchContent = chapters.slice(start, end).join('\n\n');
  
  var rawEl = document.getElementById('raw-detail');
  if (rawEl) rawEl.value = batchContent;
  
  var info = document.getElementById('detail-pager-info');
  if (info) info.textContent = '第' + currentBatch + '/' + totalBatches + '批 (' + chapters.length + '章)';
  
  var prevBtn = document.getElementById('detail-pager-prev');
  var nextBtn = document.getElementById('detail-pager-next');
  if (prevBtn) prevBtn.disabled = _detailPageIdx <= 0;
  if (nextBtn) nextBtn.disabled = _detailPageIdx >= totalBatches - 1;
}

window.detailPrevPage = function(){
  var content = getDetailContent();
  if (!content) return;
  var chapters = parseDetailChaptersV48(content);
  var totalBatches = Math.ceil(chapters.length / 10) || 1;
  _detailPageIdx = Math.max(0, _detailPageIdx - 1);
  updateDetailDisplay();
};
window.detailNextPage = function(){
  var content = getDetailContent();
  if (!content) return;
  var chapters = parseDetailChaptersV48(content);
  var totalBatches = Math.ceil(chapters.length / 10) || 1;
  _detailPageIdx = Math.min(totalBatches - 1, _detailPageIdx + 1);
  updateDetailDisplay();
};

// ===== v48: 细纲导入功能 =====
window.hideImportArea = function(){
  var area = document.getElementById('detail-import-area');
  if(area) area.style.display = 'none';
};
window.importDetailText = function(){
  try{
    var textEl = document.getElementById('detail-import-text');
    var rawEl = document.getElementById('raw-detail');
    if(!textEl || !rawEl || !textEl.value.trim()){ showToast('请粘贴细纲文本',{error:true}); return; }
    rawEl.value = textEl.value;
    var work = getCurrentWork();
    if(work){ work.detail = textEl.value; if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work); }
    hideImportArea();
    showToast('✅ 已导入细纲');
  }catch(e){ console.error('importDetailText:',e); showToast('导入失败',{error:true}); }
};

// ===== v48: 后台生成切换 =====
var _bgGenRunning = false;
window.switchToBackgroundGen = function(){
  _bgGenRunning = true;
  document.getElementById('detail-progress').style.display = 'none';
  var indicator = document.getElementById('bg-gen-indicator');
  if(indicator) indicator.style.display = 'block';
  showToast('已切换到后台生成，可继续浏览其他模块',{duration:2500});
};
window.cancelGeneration = function(){
  _bgGenRunning = false;
  document.getElementById('detail-progress').style.display = 'none';
  var indicator = document.getElementById('bg-gen-indicator');
  if(indicator) indicator.style.display = 'none';
  showToast('已取消生成');
};
window.switchToFrontGen = function(){
  document.getElementById('detail-progress').style.display = '';
  var indicator = document.getElementById('bg-gen-indicator');
  if(indicator) indicator.style.display = 'none';
};

// ===== v48: 保存确认弹窗 =====
window.cancelSave = function(){
  document.getElementById('save-confirm-modal').style.display = 'none';
};
window.confirmSave = function(){
  try{
    var module = _selectedModule || 'world';
    var work = getCurrentWork();
    if(!work){ showToast('无作品',{error:true}); return; }
    var rawEl = document.getElementById('raw-' + module);
    if(rawEl){ work[module] = rawEl.value || ''; }
    if(typeof DB !== 'undefined' && typeof DB.saveWork === 'function') DB.saveWork(work);
    document.getElementById('save-confirm-modal').style.display = 'none';
    showToast('✅ 已保存并解锁');
    // 自动跳转到下一个模块
    var nextMap = { world:'chars', chars:'outline', outline:'detail' };
    var next = nextMap[module];
    if(next){ _selectedModule = next; goToLevel(4); }
  }catch(e){ console.error('confirmSave:',e); showToast('保存失败',{error:true}); }
};
</script>
