<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>文心笔匠 - 首页 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
:root{
  --primary:#6366f1;
  --primary-dark:#4f46e5;
  --gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  --gradient-warm:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);
  --gradient-cool:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
  --gradient-green:linear-gradient(135deg,#43e97b 0%,#38f9d7 100%);
  --gradient-orange:linear-gradient(135deg,#fa709a 0%,#fee140 100%);
  --bg:#f0f2f5;
  --card:#fff;
  --text-1:#1a1a2e;
  --text-2:#6b7280;
  --text-3:#9ca3af;
  --border:#e5e7eb;
  --radius:16px;
  --shadow:0 4px 20px rgba(0,0,0,0.06);
  --shadow-hover:0 8px 30px rgba(0,0,0,0.12);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text-1);display:flex;flex-direction:column}

/* ===== 顶部栏 ===== */
.page-header{
  background:var(--gradient);
  height:56px;min-height:56px;
  display:flex;align-items:center;
  padding:0 16px;gap:10px;
  flex-shrink:0;
  box-shadow:0 2px 12px rgba(102,126,234,0.3);
}
.page-title{flex:1;text-align:center;font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,0.15)}
.placeholder{width:24px}
.cloud-btn{
  display:flex;align-items:center;gap:5px;
  font-size:12px;padding:6px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  color:#fff;font-weight:600;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  white-space:nowrap;
  transition:all .2s;
  border:1px solid rgba(255,255,255,0.15);
}
.cloud-btn:active{transform:scale(0.95);background:rgba(255,255,255,0.3)}
.cloud-btn.offline{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8)}
.cloud-btn .cb-icon{font-size:14px;line-height:1}

/* ===== 主内容区 ===== */
.quick-list{
  flex:1;
  display:flex;flex-direction:column;
  gap:10px;
  padding:14px 14px 76px;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

/* 主推卡片 - 新建小说 */
.hero-card{
  background:var(--gradient);
  border-radius:20px;
  padding:20px 18px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 6px 24px rgba(102,126,234,0.35);
  transition:all .2s;
  position:relative;
  overflow:hidden;
}
.hero-card::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;
  background:rgba(255,255,255,0.1);
  border-radius:50%;
}
.hero-card::after{
  content:'';position:absolute;bottom:-40px;right:20px;
  width:80px;height:80px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
}
.hero-card:active{transform:scale(0.97);box-shadow:0 3px 12px rgba(102,126,234,0.3)}
.hero-card .hc-icon{
  width:52px;height:52px;
  border-radius:16px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  z-index:1;
}
.hero-card .hc-info{flex:1;min-width:0;z-index:1}
.hero-card .hc-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:0.5px}
.hero-card .hc-desc{font-size:12px;color:rgba(255,255,255,0.85);margin-top:4px}
.hero-card .hc-arrow{color:rgba(255,255,255,0.6);font-size:22px;flex-shrink:0;z-index:1}

/* 功能卡片网格 */
.feature-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.feature-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px 14px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow);
  transition:all .2s;
  position:relative;
  overflow:hidden;
}
.feature-card:active{transform:scale(0.96);box-shadow:var(--shadow-hover)}
.feature-card .fc-icon{
  width:44px;height:44px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.feature-card .fc-name{font-size:14px;font-weight:700;color:var(--text-1)}
.feature-card .fc-desc{font-size:11px;color:var(--text-3);line-height:1.4}
.feature-card .fc-badge{
  position:absolute;top:10px;right:10px;
  font-size:9px;padding:2px 6px;
  border-radius:8px;font-weight:600;
}

/* 图标背景色 */
.icon-purple{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.icon-blue{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff}
.icon-green{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#fff}
.icon-pink{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}
.icon-orange{background:linear-gradient(135deg,#fa709a,#fee140);color:#fff}
.icon-cyan{background:linear-gradient(135deg,#a8edea,#fed6e3);color:#6366f1}

/* 底部导航 */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;
  height:64px;min-height:64px;
  background:#fff;
  display:flex;align-items:center;justify-content:space-around;
  box-shadow:0 -2px 12px rgba(0,0,0,0.06);
  padding-bottom:env(safe-area-inset-bottom,0);
  z-index:100;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:11px;color:var(--text-3);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  padding:6px 0;gap:3px;
  transition:color .2s;
}
.tab-item.active{color:var(--primary);font-weight:600}
.tab-icon{font-size:22px;line-height:1;transition:transform .2s}
.tab-item.active .tab-icon{transform:translateY(-2px)}

/* Toast */
.toast{
  position:fixed;top:72px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:#fff;
  padding:10px 20px;border-radius:24px;
  font-size:13px;z-index:999;
  opacity:0;pointer-events:none;
  transition:.25s;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.toast.show{opacity:1}

/* 登录面板 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.mask.show{display:flex}
.panel{
  width:86%;max-width:360px;
  background:#fff;border-radius:24px;
  padding:24px;
  box-shadow:0 12px 48px rgba(0,0,0,.2);
  animation:panelIn .3s cubic-bezier(.4,0,.2,1);
}
@keyframes panelIn{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel h3{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--text-1)}
.panel p{font-size:12px;color:var(--text-2);margin-bottom:14px;line-height:1.5}
.panel label{font-size:12px;color:var(--text-1);font-weight:600;display:block;margin:10px 0 5px}
.panel input{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:12px;font-size:14px;
  outline:none;background:#f9fafb;
  transition:all .2s;
}
.panel input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,0.1)}
.panel .row{display:flex;gap:10px;margin-top:16px}
.panel button{
  flex:1;padding:12px;
  border:none;border-radius:12px;
  font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.panel button:active{transform:scale(0.97)}
.panel button.primary{background:var(--gradient);color:#fff;box-shadow:0 3px 12px rgba(102,126,234,0.3)}
.panel button.secondary{background:#f3f4f6;color:var(--text-1)}
.panel button.danger{background:#fef2f2;color:#ef4444}
.panel .switch{font-size:13px;color:var(--primary);cursor:pointer;margin-top:12px;text-align:center;font-weight:500}
</style>
</head>
<body>

<div class="page-header">
  <div class="placeholder"></div>
  <div class="page-title">文心笔匠</div>
  <div class="cloud-btn" id="cloud-btn" onclick="toggleLoginPanel()"><span class="cb-icon">☁️</span><span id="cloud-btn-text">未登录</span></div>
</div>

<div class="quick-list">

  <!-- 主推：新建小说 -->
  <div class="hero-card" onclick="location.href='new-book.html'">
    <div class="hc-icon">✨</div>
    <div class="hc-info">
      <div class="hc-name">新建小说</div>
      <div class="hc-desc">定名 · 简介 · 全维度题材选择</div>
    </div>
    <div class="hc-arrow">›</div>
  </div>

  <!-- 功能卡片网格 -->
  <div class="feature-grid">
    <div class="feature-card" onclick="location.href='architecture.html'">
      <div class="fc-icon icon-purple">📋</div>
      <div class="fc-name">架构设计</div>
      <div class="fc-desc">世界观·人设·大纲·细纲</div>
    </div>
    <div class="feature-card" onclick="location.href='write.html'">
      <div class="fc-icon icon-blue">✍️</div>
      <div class="fc-name">AI写作</div>
      <div class="fc-desc">AI辅助创作与编辑</div>
    </div>
    <div class="feature-card" onclick="location.href='work-list.html'">
      <div class="fc-icon icon-green">📂</div>
      <div class="fc-name">作品管理</div>
      <div class="fc-desc">管理小说与架构内容</div>
    </div>
    <div class="feature-card" onclick="location.href='template-library.html'">
      <div class="fc-icon icon-pink">📦</div>
      <div class="fc-name">模板管理</div>
      <div class="fc-desc">AI自动收录·专属评价</div>
    </div>
    <div class="feature-card" onclick="location.href='center.html'">
      <div class="fc-icon icon-orange">🧭</div>
      <div class="fc-name">创作中枢</div>
      <div class="fc-desc">记忆·备份·体检·看板</div>
    </div>
    <div class="feature-card" onclick="location.href='data-predict.html'">
      <div class="fc-icon icon-cyan">📈</div>
      <div class="fc-name">数据预测</div>
      <div class="fc-desc">作品数据AI分析预测</div>
    </div>
  </div>

</div>

<div class="tab-bar">
  <div class="tab-item active" onclick="location.href='index.html'"><div class="tab-icon">🏠</div><div>首页</div></div>
  <div class="tab-item" onclick="location.href='work-list.html'"><div class="tab-icon">📚</div><div>作品</div></div>
  <div class="tab-item" onclick="location.href='architecture.html'"><div class="tab-icon">🔧</div><div>工具</div></div>
  <div class="tab-item" onclick="location.href='settings.html'"><div class="tab-icon">⚙️</div><div>设置</div></div>
</div>

<div class="toast" id="toast"></div>

<div class="mask" id="login-mask">
  <div class="panel" id="login-panel"></div>
</div>

<script src="assets/js/nav-helper.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/cloud-sync.js"></script>
<script>
// 初始化云端同步（cloud-sync.js 已自动处理，这里不再覆盖）
</script>
<script>

(function(){
  var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? (location.port === '8787' ? 'http://localhost:8787/api' : 'https://wxbj-main.pages.dev/api')
    : (location.protocol === 'file:' || location.hostname === 'capacitor' || !location.hostname)
      ? 'https://wxbj-main.pages.dev/api'
      : '/api';
  var mode = 'login';

  function getToken(){ try{ return localStorage.getItem('wxbj_cloud_token')||''; }catch(e){ return ''; } }
  function getUser(){ try{ return JSON.parse(localStorage.getItem('wxbj_cloud_user')||'null'); }catch(e){ return null; } }
  function he(s){ return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
  function setToken(token, user){
    try{ localStorage.setItem('wxbj_cloud_token', token); }catch(e){}
    try{ localStorage.setItem('wxbj_cloud_user', JSON.stringify(user)); }catch(e){}
    // 同步更新 cloud 实例状态，确保登录后立即可以调用 smartSync
    if(window.cloud){
      window.cloud.token = token;
      window.cloud.user = user;
    }
    updateCloudBtn();
  }
  function clearToken(){
    try{ localStorage.removeItem('wxbj_cloud_token'); }catch(e){}
    try{ localStorage.removeItem('wxbj_cloud_user'); }catch(e){}
    if(window.cloud){
      window.cloud.token = null;
      window.cloud.user = null;
    }
    updateCloudBtn();
  }

  function updateCloudBtn(){
    var token = getToken();
    var user = getUser();
    var btn = document.getElementById('cloud-btn');
    var text = document.getElementById('cloud-btn-text');
    if(token && user){
      btn.classList.remove('offline');
      text.textContent = user.nickname ? user.nickname : (user.email || '已登录');
    } else {
      btn.classList.add('offline');
      text.textContent = '未登录';
    }
  }

  function rebuildLoginPanel(){
    document.getElementById('login-panel').innerHTML =
      '<h3 id="panel-title">登录云端</h3>' +
      '<p id="panel-msg">登录后可在多设备间同步作品与备份。</p>' +
      '<label>邮箱</label>' +
      '<input type="email" id="login-email" placeholder="your@email.com">' +
      '<label>密码</label>' +
      '<input type="password" id="login-password" placeholder="至少6位">' +
      '<div id="login-nickname-wrap" style="display:none">' +
      '<label>昵称（可选）</label>' +
      '<input type="text" id="login-nickname" placeholder="显示你的昵称">' +
      '</div>' +
      '<div class="row">' +
      '<button class="secondary" onclick="toggleLoginPanel()">取消</button>' +
      '<button class="primary" id="login-submit" onclick="submitCloudLogin()">登录</button>' +
      '</div>' +
      '<div class="switch" id="login-switch" onclick="switchMode()">没有账号？注册</div>' +
      '<div class="switch" id="forgot-link" onclick="showForgotPanel()" style="margin-top:4px">忘记密码？</div>';
    mode = 'login';
  }

  window.toggleLoginPanel = function(){
    var mask = document.getElementById('login-mask');
    var token = getToken();
    var user = getUser();
    if(token && user){ showLogoutPanel(); } else { rebuildLoginPanel(); }
    mask.classList.toggle('show');
  };

  function showLoginPanel(){
    mode = 'login';
    var el = document.getElementById('panel-title'); if(el) el.textContent = '登录云端';
    el = document.getElementById('panel-msg'); if(el) el.textContent = '登录后可在多设备间同步作品与备份。';
    el = document.getElementById('login-nickname-wrap'); if(el) el.style.display = 'none';
    el = document.getElementById('login-switch'); if(el) el.textContent = '没有账号？注册';
    el = document.getElementById('login-submit'); if(el) el.textContent = '登录';
  }

  window.switchMode = function(){
    if(mode === 'login'){
      mode = 'register';
      document.getElementById('panel-title').textContent = '注册云端';
      document.getElementById('panel-msg').textContent = '创建账号后可在多设备间同步作品与备份。';
      document.getElementById('login-nickname-wrap').style.display = 'block';
      document.getElementById('login-switch').textContent = '已有账号？登录';
      document.getElementById('login-submit').textContent = '注册';
    } else {
      rebuildLoginPanel();
    }
  };

  // ========== 忘记密码 ==========
  window.showForgotPanel = function(){
    mode = 'forgot';
    document.getElementById('login-panel').innerHTML =
      '<h3>找回密码</h3>' +
      '<p style="font-size:12px;color:#666;line-height:1.6">请输入注册时使用的邮箱，我们将为你生成一个 6 位验证码（15 分钟有效）。</p>' +
      '<label>邮箱</label>' +
      '<input type="email" id="forgot-email" placeholder="your@email.com">' +
      '<div class="row">' +
      '<button class="secondary" onclick="backToLogin()">返回</button>' +
      '<button class="primary" id="forgot-submit" onclick="submitForgotPassword()">发送验证码</button>' +
      '</div>';
  };

  window.backToLogin = function(){
    rebuildLoginPanel();
  };

  window.submitForgotPassword = function(){
    var email = document.getElementById('forgot-email').value.trim();
    if(!email){ showToast('请输入邮箱'); return; }

    document.getElementById('forgot-submit').textContent = '发送中...';
    fetch(API_BASE + '/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: email })
    }).then(function(r){ return r.text().then(function(t){ try{return JSON.parse(t);}catch(e){return{error:'服务器返回异常'};}}); })
      .then(function(data){
        if(data.error){ showToast(data.error); document.getElementById('forgot-submit').textContent = '发送验证码'; return; }
        showResetPanel(email, data.code);
      }).catch(function(){
        showToast('网络异常，请稍后重试');
        document.getElementById('forgot-submit').textContent = '发送验证码';
      });
  };

  function showResetPanel(email, code){
    document.getElementById('login-panel').innerHTML =
      '<h3>设置新密码</h3>' +
      '<p style="font-size:12px;color:#666">邮箱：' + email + '</p>' +
      (code ? '<p style="font-size:13px;background:#fef9c3;padding:8px 10px;border-radius:8px;margin-bottom:10px;color:#854d0e;line-height:1.5"><b>验证码：' + code + '</b><br><span style="font-size:11px;color:#a16207">（本版本为单机使用，直接展示验证码；生产环境需接入邮件发送服务）</span></p>' : '') +
      '<label>验证码</label>' +
      '<input type="text" id="reset-code" placeholder="6 位数字验证码">' +
      '<label>新密码</label>' +
      '<input type="password" id="reset-password" placeholder="至少6位">' +
      '<label>确认新密码</label>' +
      '<input type="password" id="reset-password2" placeholder="再次输入新密码">' +
      '<div class="row">' +
      '<button class="secondary" onclick="showForgotPanel()">返回</button>' +
      '<button class="primary" id="reset-submit" onclick="submitResetPassword(\'' + email + '\')">确认重置</button>' +
      '</div>';
  }

  window.submitResetPassword = function(email){
    var code = document.getElementById('reset-code').value.trim();
    var password = document.getElementById('reset-password').value.trim();
    var password2 = document.getElementById('reset-password2').value.trim();

    if(!code){ showToast('请输入验证码'); return; }
    if(!password || !password2){ showToast('请输入新密码'); return; }
    if(password.length < 6){ showToast('密码至少6位'); return; }
    if(password !== password2){ showToast('两次输入的密码不一致'); return; }

    document.getElementById('reset-submit').textContent = '提交中...';
    fetch(API_BASE + '/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: email, code: code, password: password })
    }).then(function(r){ return r.text().then(function(t){ try{return JSON.parse(t);}catch(e){return{error:'服务器返回异常'};}}); })
      .then(function(data){
        if(data.error){ showToast(data.error); document.getElementById('reset-submit').textContent = '确认重置'; return; }
        // 重置成功，自动登录
        setToken(data.token, data.user);
        document.getElementById('login-mask').classList.remove('show');
        showToast('密码重置成功，已自动登录');
      }).catch(function(){
        showToast('网络异常，请稍后重试');
        document.getElementById('reset-submit').textContent = '确认重置';
      });
  };

  function showLogoutPanel(){
    var user = getUser();
    var email = user ? user.email : '';
    document.getElementById('login-panel').innerHTML =
      '<h3>云端同步</h3>' +
      '<p style="font-size:12px;color:#888;margin:4px 0 12px;">账号：' + he(email || '') + '</p>' +
      '<div class="row">' +
      '<button class="secondary" id="logout-sync-btn" onclick="doManualSync()" style="flex:2;background:#f0f2ff;color:#6366f1;font-weight:600;">🔄 双向同步</button>' +
      '<button class="secondary" onclick="toggleLoginPanel()">关闭</button>' +
      '</div>' +
      '<div id="sync-status" style="display:none;margin-top:10px;font-size:12px;color:#666;padding:8px;background:#f9f9f9;border-radius:8px;line-height:1.6;"></div>' +
      '<div class="row" style="margin-top:10px">' +
      '<button class="primary" onclick="location.href=\'center.html\'">进入中枢</button>' +
      '</div>' +
      '<div class="row" style="margin-top:10px">' +
      '<button class="danger" onclick="doCloudLogout()">退出登录</button>' +
      '</div>';
  }

  // 手动双向同步（本地缺的上传，云端缺的下载）
  window.doManualSync = function(){
    if(!window.cloud || !window.cloud.isLoggedIn()){ showToast('请先登录', {error:true}); return; }
    var btn = document.getElementById('logout-sync-btn');
    var statusEl = document.getElementById('sync-status');
    if(btn){ btn.disabled = true; btn.textContent = '同步中…'; }
    if(statusEl){ statusEl.style.display='block'; statusEl.innerHTML='正在检查本地与云端差异…'; }
    window.cloud.smartSync().then(function(report){
      var html = [];
      if(report.pushed > 0) html.push('⬆️ 上传 ' + report.pushed + ' 部');
      if(report.pulled > 0) html.push('⬇️ 下载 ' + report.pulled + ' 部');
      if(report.deleted > 0) html.push('🗑 云端删除 ' + report.deleted + ' 部');
      if(report.unchanged > 0) html.push('✅ 无变化 ' + report.unchanged + ' 部');
      if(report.errors > 0) html.push('⚠️ ' + report.errors + ' 个失败');
      if(html.length === 0) html.push('已完成');
      var msg = html.join(' &nbsp; ');
      if(statusEl) statusEl.innerHTML = msg;
      if(btn){ btn.disabled = false; btn.textContent = '🔄 再次同步'; }
      showToast('同步完成：' + msg, {duration: 3000});
      if(report.pulled > 0) setTimeout(function(){ location.reload(); }, 1500);
    }).catch(function(e){
      if(statusEl) statusEl.innerHTML = '同步失败：' + (e.message || e);
      if(btn){ btn.disabled = false; btn.textContent = '🔄 重试同步'; }
      showToast('同步失败：' + (e.message || e), {error:true});
    });
  };

  window.doCloudLogout = function(){
    clearToken();
    document.getElementById('login-mask').classList.remove('show');
    showToast('已退出登录');
  };

  window.submitCloudLogin = function(){
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value.trim();
    if(!email || !password){ showToast('请填写邮箱和密码'); return; }
    if(password.length < 6){ showToast('密码至少6位'); return; }

    var url = mode === 'login' ? API_BASE + '/auth/login' : API_BASE + '/auth/register';
    var body = { email: email, password: password };
    if(mode === 'register'){
      var nick = document.getElementById('login-nickname').value.trim();
      if(nick) body.nickname = nick;
    }

    document.getElementById('login-submit').textContent = mode === 'login' ? '登录中...' : '注册中...';
    fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).then(function(r){ return r.text().then(function(t){ try{return JSON.parse(t);}catch(e){return{error:'服务器返回异常'};}}); })
      .then(function(data){
        if(data.error){ showToast(data.error); document.getElementById('login-submit').textContent = mode === 'login' ? '登录' : '注册'; return; }
        setToken(data.token, data.user);
        document.getElementById('login-mask').classList.remove('show');
        showToast((mode === 'login' ? '登录' : '注册') + '成功，正在同步数据...');
        // 登录成功后自动同步：推送本地作品到云端 + 从云端拉取作品
        if(window.cloud && window.cloud.isLoggedIn()){
          window.cloud.smartSync().then(function(report){
            var msg = '同步完成';
            if(report.pushed > 0) msg += '，上传' + report.pushed + '部作品';
            if(report.pulled > 0) msg += '，下载' + report.pulled + '部作品';
            if(report.errors > 0) msg += '，' + report.errors + '个失败';
            showToast(msg, {duration: 3000});
            // 刷新页面显示同步后的数据
            if(report.pulled > 0) setTimeout(function(){ location.reload(); }, 1500);
          }).catch(function(e){
            showToast('同步失败：' + e.message);
          });
        }
      }).catch(function(){
        showToast('网络异常，请稍后重试');
        document.getElementById('login-submit').textContent = mode === 'login' ? '登录' : '注册';
      });
  };

  function showToast(msg, opts){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if(opts && opts.error) el.style.background = '#fef2f2';
    else el.style.background = '';
    clearTimeout(window._toastTimer);
    var duration = (opts && opts.duration) ? opts.duration : 2200;
    window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, duration);
  }

  window.toggleLoginPanel = toggleLoginPanel;
  window.showToast = showToast;
  updateCloudBtn();
})();
</script>
<!-- ===== 自动更新检测 ===== -->
<script>
(function() {
  var LOCAL_VERSION = '1.0.0';
  var LOCAL_VERSION_CODE = 2;
  var REMOTE_VERSION_URL = 'https://wxbj-main.pages.dev/version.json';
  var lastCheckKey = 'wxbj_last_update_check';

  function isAndroidApp() {
    try {
      if (typeof window.Capacitor !== 'undefined') return true;
      if (navigator.userAgent.indexOf('wv') >= 0) return true;
      if (window.location.protocol === 'file:') return true;
    } catch(e) {}
    return false;
  }

  function checkUpdate(silent) {
    if (!isAndroidApp()) return;
    try {
      var now = Date.now();
      var lastCheck = parseInt(localStorage.getItem(lastCheckKey) || '0');
      if (silent && now - lastCheck < 4 * 3600 * 1000) return;
      localStorage.setItem(lastCheckKey, now.toString());

      fetch(REMOTE_VERSION_URL + '?t=' + now, { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data || !data.versionCode) return;
          if (data.versionCode > LOCAL_VERSION_CODE) {
            showUpdateDialog(data);
          }
        })
        .catch(function(e) { console.warn('更新检测失败', e); });
    } catch(e) {}
  }

  function showUpdateDialog(data) {
    try {
      var html = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;" id="wxbj-update-dialog">'
        + '<div style="background:#fff;border-radius:16px;padding:20px;max-width:320px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2);">'
        + '<div style="font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px;">✨ 发现新版本 v' + (data.version || '') + '</div>'
        + '<div style="font-size:13px;color:#666;line-height:1.6;margin-bottom:16px;white-space:pre-wrap;">' + (data.releaseNotes || '点击下方按钮下载更新') + '</div>'
        + '<button id="wxbj-update-btn" style="width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:14px;font-weight:600;cursor:pointer;">立即下载更新</button>'
        + '<button id="wxbj-update-cancel" style="width:100%;padding:10px;margin-top:8px;border:none;background:transparent;color:#999;font-size:13px;cursor:pointer;">稍后再说</button>'
        + '</div></div>';
      document.body.insertAdjacentHTML('beforeend', html);
      document.getElementById('wxbj-update-btn').onclick = function() {
        window.open(data.downloadUrl || REMOTE_VERSION_URL, '_system');
      };
      document.getElementById('wxbj-update-cancel').onclick = function() {
        var d = document.getElementById('wxbj-update-dialog');
        if (d) d.remove();
      };
    } catch(e) { console.warn(e); }
  }

  // 页面加载后自动检测
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { checkUpdate(true); });
  } else {
    checkUpdate(true);
  }

  // 暴露手动检测入口
  window.checkAppUpdate = function() { checkUpdate(false); };
})();
</script>
