<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>文心笔匠 - 预览</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root {
  --bg-paper: #faf8f5;
  --bg-warm: #f5f0e8;
  --ink-dark: #2c2416;
  --ink-light: #6b5d4d;
  --accent-red: #c45c4a;
  --accent-gold: #b8956c;
  --border-subtle: rgba(139, 119, 92, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Serif SC', -apple-system, sans-serif;
  background: #1a1a1a;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.phone-frame {
  width: 375px;
  height: 667px;
  background: var(--bg-paper);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 50px 100px rgba(0,0,0,0.5);
}

.phone-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 50px 0 70px;
}

/* 顶部 */
.header {
  text-align: center;
  padding: 0 24px 16px;
}

.logo {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 24px;
  color: var(--ink-dark);
  letter-spacing: 4px;
}

.tagline {
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 2px;
  margin-top: 2px;
}

/* 网格布局 */
.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 16px;
  align-content: center;
}

.grid-item {
  background: linear-gradient(135deg, #fff 0%, var(--bg-warm) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 14px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.grid-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--accent-red), var(--accent-gold));
  transform: scaleY(0);
  transition: transform 0.3s;
}

.grid-item:active {
  transform: scale(0.95);
}

.grid-item:hover::before {
  transform: scaleY(1);
}

.grid-icon {
  font-size: 26px;
}

.grid-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-dark);
  text-align: center;
}

/* 底部导航 */
.nav-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(250, 248, 245, 0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-subtle);
  padding: 6px 0;
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: space-around;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  color: var(--ink-light);
  font-size: 9px;
  cursor: pointer;
  padding: 4px 16px;
}

.nav-item.active {
  color: var(--accent-red);
}

.nav-item span:first-child {
  font-size: 20px;
}

/* 云端状态 */
.cloud-status {
  position: absolute;
  top: 50px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--bg-warm);
  border-radius: 12px;
  font-size: 10px;
  color: var(--ink-light);
}

.cloud-dot {
  width: 5px;
  height: 5px;
  background: var(--accent-gold);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-content">
    <div class="cloud-status">
      <div class="cloud-dot"></div>
      <span>已同步</span>
    </div>
    
    <div class="header">
      <div class="logo">文心笔匠</div>
      <div class="tagline">以文载道 · 匠心独运</div>
    </div>
    
    <div class="grid">
      <div class="grid-item">
        <div class="grid-icon">✨</div>
        <div class="grid-name">新建小说</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">📋</div>
        <div class="grid-name">架构设计</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">✍</div>
        <div class="grid-name">AI写作</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">📂</div>
        <div class="grid-name">作品管理</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">📄</div>
        <div class="grid-name">模板库</div>
      </div>
      <div class="grid-item">
        <div class="grid-icon">🧭</div>
        <div class="grid-name">创作中枢</div>
      </div>
    </div>
  </div>
  
  <div class="nav-bar">
    <div class="nav-item active">
      <span>🏠</span>
      <span>首页</span>
    </div>
    <div class="nav-item">
      <span>🔧</span>
      <span>工具</span>
    </div>
    <div class="nav-item">
      <span>📊</span>
      <span>数据</span>
    </div>
    <div class="nav-item">
      <span>⚙️</span>
      <span>设置</span>
    </div>
  </div>
</div>

</body>
</html>
